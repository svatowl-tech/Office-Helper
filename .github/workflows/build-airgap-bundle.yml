name: "Build & Release Portable Air-Gap Office Assistant (Astra Linux 1.7.11 + Win7 + Win8+)"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win8plus-unmodified:
    name: "Сборка llama-server.exe без модификаций (Windows 8+ / 10 / 11)"
    runs-on: windows-latest
    steps:
      - name: "1. Клонирование оригинального llama.cpp (без патчей)"
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-cpp

      - name: "2. Нативная сборка llama-server.exe (MSVC /MT static, SSE4.2, Windows SDK)"
        shell: pwsh
        run: |
          cmake -B build-win8plus -S llama-cpp `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DLLAMA_BUILD_UI=OFF `
            -DLLAMA_BUILD_WEBUI=OFF `
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_AVX512=OFF -DGGML_SSE42=ON `
            -DGGML_WIN_VER=0x0A00
          cmake --build build-win8plus --config Release --target llama-server --parallel

          $builtExe = Get-ChildItem -Path build-win8plus -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $builtExe) {
            throw "Не найден собранный llama-server.exe в build-win8plus"
          }
          Copy-Item $builtExe.FullName -Destination "llama-server-win8plus-unmodified.exe" -Force
          Get-Item "llama-server-win8plus-unmodified.exe"

      - name: "3. Передача немодифицированной сборки Win8+ в основной пайплайн"
        uses: actions/upload-artifact@v4
        with:
          name: win8plus-unmodified-bin
          path: llama-server-win8plus-unmodified.exe
          retention-days: 1

  build-and-release-portable:
    name: "Сборка портативного пакета (Astra Linux 1.7.11 + Win7 + Win8+) и выпуск Release"
    runs-on: ubuntu-22.04
    needs: [build-win8plus-unmodified]
    steps:
      - name: "1. Клонирование репозитория"
        uses: actions/checkout@v4

      - name: "2. Установка кросс-компиляторов (Mingw-w64 POSIX Threads для Win7 и инструменты сборки)"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip xz-utils \
            mingw-w64-x86-64-dev gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      - name: "3. Сборка фронтенда (dist), сервера (dist-server/server.cjs) и автономного HTML"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          mkdir -p dist-airgap/bin/linux-x64
          mkdir -p dist-airgap/bin/linux-x64-avx2
          mkdir -p dist-airgap/bin/win7-x64
          mkdir -p dist-airgap/bin/win8plus-x64
          mkdir -p dist-airgap/models/sage-95m
          mkdir -p dist-airgap/tessdata

      - name: "4. Компиляция НАТИВНЫХ лаунчеров (без зависимости от .bat, cmd.exe и .sh)"
        run: |
          # 1) Нативный графический .EXE лаунчер для Windows 7/8/10/11 (прямые вызовы Win32 CreateProcessW без cmd.exe)
          x86_64-w64-mingw32-gcc-posix -O2 -mwindows -static \
            server/native-launcher.c \
            -o dist-airgap/Office-Assistant.exe \
            -lshell32 -luser32 -lkernel32
          cp dist-airgap/Office-Assistant.exe "dist-airgap/Офисный-Помощник.exe"

          # 2) Нативный 100% статический ELF-бинарник для Astra Linux (musl static — работает на ядрах 5.3, 5.4 и 6.1.188-1-generic без зависимости от glibc)
          docker run --rm -v "${{ github.workspace }}:/src" -w /src alpine:3.20 sh -c \
            "apk add --no-cache gcc musl-dev && \
             gcc -O2 -static server/native-launcher.c -o /src/dist-airgap/Office-Assistant-AstraLinux.run && \
             chmod +x /src/dist-airgap/Office-Assistant-AstraLinux.run && \
             cp /src/dist-airgap/Office-Assistant-AstraLinux.run '/src/dist-airgap/Офисный-Помощник-AstraLinux.run'"

      - name: "5. Компиляция 100% статических llama-server для Astra Linux 1.7.11 (musl static, Core i3-9100 AVX2 + универсальный SSE4.2)"
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-cpp

          # Собираем внутри Alpine (musl static), чтобы бинарник вообще не зависел от glibc и libcrypto на целевом компьютере
          # Вариант А: Универсальный SSE4.2 (без AVX/AVX2/AVX-512) для любых старых процессоров
          # Вариант Б: AVX2 + FMA (без AVX-512!) — идеально под Intel Core i3-9100 (Astra Linux 1.7.11)
          docker run --rm -v /tmp/llama-cpp:/llama -v "${{ github.workspace }}/dist-airgap:/out" alpine:3.20 sh -c '
            apk add --no-cache build-base cmake linux-headers && \
            cmake -B /tmp/build-sse -S /llama \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DLLAMA_CURL=OFF \
              -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_UI=OFF \
              -DLLAMA_BUILD_WEBUI=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_SSE42=ON \
              -DCMAKE_EXE_LINKER_FLAGS="-static" && \
            cmake --build /tmp/build-sse --target llama-server -j$(nproc) && \
            cp /tmp/build-sse/bin/llama-server /out/bin/linux-x64/llama-server && \
            chmod +x /out/bin/linux-x64/llama-server && \
            cmake -B /tmp/build-avx2 -S /llama \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DLLAMA_CURL=OFF \
              -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_UI=OFF \
              -DLLAMA_BUILD_WEBUI=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_AVX512=OFF -DGGML_SSE42=ON \
              -DCMAKE_EXE_LINKER_FLAGS="-static" && \
            cmake --build /tmp/build-avx2 --target llama-server -j$(nproc) && \
            cp /tmp/build-avx2/bin/llama-server /out/bin/linux-x64-avx2/llama-server && \
            chmod +x /out/bin/linux-x64-avx2/llama-server
          '

      - name: "6. Подключение нативной сборки llama-server.exe БЕЗ МОДИФИКАЦИЙ (Windows 8+ / 10 / 11)"
        uses: actions/download-artifact@v4
        with:
          name: win8plus-unmodified-bin
          path: .

      - name: "6.1. Укладка немодифицированной сборки Win8+ в пакет"
        run: |
          cp llama-server-win8plus-unmodified.exe dist-airgap/bin/win8plus-x64/llama-server.exe

      - name: "7. Кросс-компиляция llama-server.exe под Windows 7 SP1 x64 (С патчем cpp-httplib CreateFileW)"
        run: |
          # Патчим cpp-httplib и CMakeLists в /tmp/llama-cpp исключительно для сборки Windows 7 SP1:
          # 1) убираем директиву #error и заменяем многострочный вызов ::CreateFile2(...); на ::CreateFileW(...);
          # 2) задаем _WIN32_WINNT=0x0601 (Windows 7 SP1) через GGML_WIN_VER=0x0601
          python3 - << 'EOF'
          import glob, re

          for p in glob.glob('/tmp/llama-cpp/**/httplib.*', recursive=True):
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                  code = f.read()
              code = re.sub(r'#\s*error\s+[^\n]*Windows 8 or lower[^\n]*', '// Windows 7 SP1 compatibility patch applied', code)
              code = re.sub(r'#\s*error\s*\\\s*\n\s*"cpp-httplib doesn\'t support Windows 8 or lower[^"]*"', '// Windows 7 SP1 compatibility patch applied', code)
              code = re.sub(
                  r'::CreateFile2\s*\([^;]*?\)\s*;',
                  '::CreateFileW(wpath.c_str(), GENERIC_READ, FILE_SHARE_READ | FILE_SHARE_WRITE, NULL, OPEN_EXISTING, FILE_ATTRIBUTE_NORMAL, NULL);',
                  code,
                  flags=re.DOTALL
              )
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(code)
          EOF

          cmake -B /tmp/llama-cpp/build-win7 -S /tmp/llama-cpp \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DGGML_WIN_VER=0x0601 \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_WEBUI=OFF \
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_AVX512=OFF -DGGML_SSE42=ON
          cmake --build /tmp/llama-cpp/build-win7 --target llama-server -j$(nproc)
          cp /tmp/llama-cpp/build-win7/bin/llama-server.exe dist-airgap/bin/win7-x64/llama-server.exe
          cp /tmp/llama-cpp/build-win7/bin/llama-server.exe llama-server-win7-patched.exe

      - name: "8. Вшивание портативных бинарников Node.js 18 LTS (glibc 2.28 — совместим с Astra Linux 1.7.11 и Windows 7+)"
        run: |
          curl -L --retry 5 "https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz" -o /tmp/node-linux.tar.xz
          tar -xf /tmp/node-linux.tar.xz -C /tmp
          cp /tmp/node-v18.20.4-linux-x64/bin/node dist-airgap/bin/linux-x64/node
          chmod +x dist-airgap/bin/linux-x64/node

          curl -L --retry 5 "https://nodejs.org/dist/v18.20.4/win-x64/node.exe" -o dist-airgap/bin/win7-x64/node.exe

      - name: "9. Загрузка и включение в пакет локальных русских нейросетей (SAGE FRED-T5 + Qwen2.5-1.5B GGUF) и OCR словарей"
        run: |
          curl -L --retry 5 "https://huggingface.co/ai-forever/sage-fredt5-distilled-95m/resolve/main/config.json" -o dist-airgap/models/sage-95m/config.json
          curl -L --retry 5 "https://huggingface.co/ai-forever/sage-fredt5-distilled-95m/resolve/main/pytorch_model.bin" -o dist-airgap/models/sage-95m/pytorch_model.bin
          curl -L --retry 5 "https://huggingface.co/ai-forever/sage-fredt5-distilled-95m/resolve/main/tokenizer.json" -o dist-airgap/models/sage-95m/tokenizer.json
          curl -L --retry 5 "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" -o dist-airgap/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          curl -L --retry 5 "https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata" -o dist-airgap/tessdata/rus.traineddata
          curl -L --retry 5 "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -o dist-airgap/tessdata/eng.traineddata

      - name: "10. Формирование полностью автономного пакета (Нативный EXE/ELF, HTML без EXE, Скрипты, Win7 + Win8+)"
        run: |
          cp -r dist dist-server Офисный-Помощник-Автономный.html start-astra-linux.sh start-windows7.bat README.md dist-airgap/
          chmod +x dist-airgap/start-astra-linux.sh
          cd dist-airgap && zip -r9 ../office-assistant-ru-portable-airgap.zip . && cd ..
          tar -czf office-assistant-ru-astra-linux-portable.tar.gz -C dist-airgap .

      - name: "11. Выгрузка готовых артефактов в GitHub Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: office-assistant-ru-portable-airgap
          path: |
            office-assistant-ru-portable-airgap.zip
            office-assistant-ru-astra-linux-portable.tar.gz
            llama-server-win8plus-unmodified.exe
            llama-server-win7-patched.exe
          retention-days: 90

      - name: "12. Автоматическое создание GitHub Release с прикрепленными архивами и доп. сборкой Win 8+"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "Офисный помощник (Portable Air-Gap Release #${{ github.run_number }})"
          body: |
            ### Полностью автономный пакет для Astra Linux 1.7.11 (усиленный, ядро 6.1, Core i3-9100), Windows 7 SP1 и Windows 8+ / 10 / 11
            В состав релиза включены:
            1. **`office-assistant-ru-portable-airgap.zip`** — полный портативный пакет с двумя версиями Windows-сервера (`bin/win8plus-x64/llama-server.exe` **без модификаций** + `bin/win7-x64/llama-server.exe` с патчем под Windows 7 SP1) и двумя 100% статическими Linux-бинарниками (`bin/linux-x64-avx2/llama-server` под **Intel Core i3-9100** + универсальный `bin/linux-x64/llama-server` `SSE4.2`).
            2. **`llama-server-win8plus-unmodified.exe`** — отдельная нативная сборка `llama.cpp` **без каких-либо модификаций исходного кода** (Windows 8+ / 10 / 11, MSVC static `/MT`).
            3. **`llama-server-win7-patched.exe`** — отдельная сборка `llama.cpp` с патчем совместимости под Windows 7 SP1.
            4. **`Офисный-Помощник-Автономный.html`** — однофайловая браузерная версия (работает с `.docx`, `.xlsx`, `.pptx` даже в режиме **Astra Linux «Усиленный»** при блокировке сторонних бинарников и скриптов).
          files: |
            office-assistant-ru-portable-airgap.zip
            office-assistant-ru-astra-linux-portable.tar.gz
            llama-server-win8plus-unmodified.exe
            llama-server-win7-patched.exe
            Офисный-Помощник-Автономный.html
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
